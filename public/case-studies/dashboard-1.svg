<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <linearGradient id="blue-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A73E8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1A73E8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background Window Card -->
  <rect width="800" height="480" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Browser Header Bar -->
  <path d="M 0 16 Q 0 0 16 0 L 784 0 Q 800 0 800 16 L 800 36 L 0 36 Z" fill="#FFFFFF" />
  <circle cx="24" cy="18" r="4.5" fill="#EF4444" />
  <circle cx="38" cy="18" r="4.5" fill="#F59E0B" />
  <circle cx="52" cy="18" r="4.5" fill="#10B981" />
  <line x1="0" y1="36" x2="800" y2="36" stroke="#E2E8F0" stroke-width="1" />

  <!-- Google Ads Top Navigation Bar -->
  <g transform="translate(24, 52)">
    <!-- Google Ads Logo -->
    <path d="M14.2 7.4 L7.8 0 L0 13.5 L6.4 20.9 Z" fill="#FBBB00" />
    <path d="M21.6 13.5 L14.2 0 L6.4 13.5 L13.8 27 Z" fill="#4285F4" />
    <circle cx="21.6" cy="13.5" r="4.2" fill="#34A853" />
    
    <text x="32" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#202124">Google Ads</text>
    <line x1="135" y1="4" x2="135" y2="24" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="150" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#1A73E8">Overview</text>
    <line x1="148" y1="28" x2="216" y2="28" stroke="#1A73E8" stroke-width="3" stroke-linecap="round" />

    <!-- Date Range Badge -->
    <rect x="500" y="0" width="165" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <text x="512" y="18" font-family="monospace" font-size="11" font-weight="600" fill="#475569">📅 Jan 1 – Jun 12, 2026</text>
    
    <!-- User/Reports badge -->
    <rect x="675" y="0" width="75" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <text x="687" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#475569">📊 Reports</text>
  </g>

  <!-- 4 Google Ads Metric Scorecard Tiles -->
  <g transform="translate(24, 100)">
    <!-- Tile 1: BLUE (Clicks) -->
    <rect x="0" y="0" width="175" height="96" rx="12" fill="#1A73E8" filter="url(#card-shadow)" />
    <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Clicks</text>
    <text x="150" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#FFFFFF">▾</text>
    <text x="14" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">911K</text>
    <text x="14" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#D1E4FF">↑ +12.4% vs past period</text>

    <!-- Tile 2: RED (Impressions) -->
    <rect x="192" y="0" width="175" height="96" rx="12" fill="#D93025" filter="url(#card-shadow)" />
    <text x="206" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Impressions</text>
    <text x="342" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#FFFFFF">▾</text>
    <text x="206" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">27.2M</text>
    <text x="206" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FCE8E6">↑ +8.1% High SERP</text>

    <!-- Tile 3: AMBER (CTR) -->
    <rect x="384" y="0" width="175" height="96" rx="12" fill="#F9AB00" filter="url(#card-shadow)" />
    <text x="398" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">CTR</text>
    <text x="534" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#FFFFFF">▾</text>
    <text x="398" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">3.34%</text>
    <text x="398" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FEF3D6">Top Page Rank (89%)</text>

    <!-- Tile 4: GREEN (Cost) -->
    <rect x="576" y="0" width="176" height="96" rx="12" fill="#1E8E3E" filter="url(#card-shadow)" />
    <text x="590" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Cost</text>
    <text x="726" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#FFFFFF">▾</text>
    <text x="590" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">$356K</text>
    <text x="590" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#E6F4EA">-70% Cost Per Lead</text>
  </g>

  <!-- Performance Over Time Chart Section -->
  <g transform="translate(24, 215)">
    <rect x="0" y="0" width="752" height="235" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    
    <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#202124">Performance over time</text>
    
    <!-- Y Axis Labels -->
    <text x="20" y="65" font-family="monospace" font-size="10" fill="#94A3B8">911K</text>
    <text x="20" y="115" font-family="monospace" font-size="10" fill="#94A3B8">27.2M</text>
    <text x="20" y="165" font-family="monospace" font-size="10" fill="#94A3B8">$356K</text>

    <!-- Grid Horizontal Lines -->
    <line x1="65" y1="60" x2="730" y2="60" stroke="#F1F5F9" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="65" y1="110" x2="730" y2="110" stroke="#F1F5F9" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="65" y1="160" x2="730" y2="160" stroke="#F1F5F9" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="65" y1="195" x2="730" y2="195" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Performance Curves -->
    <path d="M 65 180 Q 180 190 280 130 T 500 80 T 730 50 L 730 195 L 65 195 Z" fill="url(#blue-grad)" />
    <path d="M 65 180 Q 180 190 280 130 T 500 80 T 730 50" fill="none" stroke="#1A73E8" stroke-width="3" stroke-linecap="round" />
    <path d="M 65 190 Q 200 170 340 120 T 560 70 T 730 65" fill="none" stroke="#D93025" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 65 185 Q 220 180 380 140 T 600 100 T 730 90" fill="none" stroke="#F9AB00" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 65 192 Q 240 185 400 110 T 620 60 T 730 40" fill="none" stroke="#1E8E3E" stroke-width="3" stroke-linecap="round" />

    <!-- X Axis Labels -->
    <text x="65" y="215" font-family="monospace" font-size="10.5" fill="#64748B">Jan 1</text>
    <text x="210" y="215" font-family="monospace" font-size="10.5" fill="#64748B">Feb</text>
    <text x="360" y="215" font-family="monospace" font-size="10.5" fill="#64748B">Mar</text>
    <text x="510" y="215" font-family="monospace" font-size="10.5" fill="#64748B">Apr</text>
    <text x="690" y="215" font-family="monospace" font-size="10.5" fill="#64748B">Jun 12</text>
  </g>
</svg>
